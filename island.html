<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="island.css">
</head>
<body>
  <div id="wrap">
    <div id="pill" class="rim">
      <div id="progress"><span id="progress-fill"></span></div>
      <div class="pill-top">
        <span class="mark" id="mark" aria-hidden="true">[ ]</span>
        <span id="head-title">Todo Island</span>
        <span id="head-count" class="count"></span>
        <div class="tools">
          <button id="btn-pin" data-i18n-title="isl.pin.title" data-i18n-aria="isl.pin.aria">
            <svg class="ic" viewBox="0 0 24 24"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V5a2 2 0 0 0 2-2H7a2 2 0 0 0 2 2z"/></svg>
          </button>
          <button id="btn-share" data-i18n-title="win.share.title" data-i18n-aria="win.share.aria">
            <svg class="ic" viewBox="0 0 24 24"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v13"/></svg>
          </button>
          <button id="btn-gear" data-i18n-title="isl.gear.title" data-i18n-aria="isl.gear.aria">
            <svg class="ic" viewBox="0 0 24 24"><path d="M4 6l1 1 2-2"/><path d="M4 13l1 1 2-2"/><path d="M4 20l1 1 2-2"/><path d="M10.5 6H20"/><path d="M10.5 13H20"/><path d="M10.5 20H20"/></svg>
          </button>
          <button id="btn-close" data-i18n-title="isl.close.title" data-i18n-aria="isl.close.aria">
            <svg class="ic" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>
      </div>
      <div id="body"></div>
      <div id="undo-bar" hidden role="status" aria-live="polite"></div>
    </div>
  </div>
  <script src="sfx.js"></script>
  <script src="motion.js"></script>
  <script src="locales/en.js"></script>
<script src="locales/ar.js"></script>
<script src="lib/i18n.js"></script>
<script src="ui-shared.js"></script>
  <script src="island.js"></script>
</body>
</html>
