<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="island.css">
</head>
<body>
  <div id="wrap">
    <div id="pill">
      <div id="progress"><span id="progress-fill"></span></div>
      <div class="pill-top">
        <span class="dot"></span>
        <span id="head-title">Todo Island</span>
        <span id="head-count" class="count"></span>
        <div class="tools">
          <button id="btn-pin" title="Pin — keep on screen" aria-label="Pin island on screen">
            <svg class="ic" viewBox="0 0 24 24"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V5a2 2 0 0 0 2-2H7a2 2 0 0 0 2 2z"/></svg>
          </button>
          <button id="btn-expand" title="Show all" aria-label="Show all tasks">
            <svg class="ic chev-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
            <svg class="ic chev-up" viewBox="0 0 24 24"><path d="M18 15l-6-6-6 6"/></svg>
          </button>
          <button id="btn-gear" title="Open tasks window" aria-label="Open tasks window">
            <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </button>
          <button id="btn-close" title="Hide" aria-label="Hide island">
            <svg class="ic" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>
      </div>
      <div id="body"></div>
      <div id="undo-bar" hidden></div>
    </div>
  </div>
  <script src="island.js"></script>
</body>
</html>
