<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="island.css">
</head>
<body>
  <!-- the liquid-glass lens is baked into #gl-bd's pixels by island.js paint() (PERF: no SVG filter) -->
  <div id="wrap">
    <div id="pill">
      <canvas class="gl gl-bd" id="gl-bd" aria-hidden="true"></canvas>
      <span class="gl gl-tint" aria-hidden="true"></span>
      <span class="gl gl-arc" id="gl-arc" aria-hidden="true"></span>
      <span class="gl gl-rim" aria-hidden="true"></span>
      <div id="progress" aria-hidden="true"><span id="progress-fill"></span></div>
      <div class="pill-top">
        <span class="mark" id="mark" aria-hidden="true">[ ]</span>
        <span id="head-title">Todo Island</span>
        <span id="head-count" class="count"></span>
        <button id="timer-chip" class="timer-chip" type="button" hidden></button>
        <button id="btn-update" class="upd" type="button" hidden><span class="upd-dot" aria-hidden="true"></span><span data-i18n="upd.label">Update</span></button>
        <div class="tools">
          <button id="btn-add" data-i18n-title="isl.add.title" data-i18n-aria="isl.add.title">
            <svg class="ic" data-icon="plus" viewBox="0 0 24 24"></svg>
          </button>
          <button id="btn-pin" data-i18n-title="isl.pin.title" data-i18n-aria="isl.pin.aria">
            <svg class="ic" data-icon="pin" viewBox="0 0 24 24"></svg>
          </button>
          <button id="btn-share" data-i18n-title="win.share.title" data-i18n-aria="win.share.aria">
            <svg class="ic" data-icon="share" viewBox="0 0 24 24"></svg>
          </button>
          <button id="btn-gear" data-i18n-title="isl.gear.title" data-i18n-aria="isl.gear.aria">
            <svg class="ic" data-icon="tasks" viewBox="0 0 24 24"></svg>
          </button>
          <button id="btn-close" data-i18n-title="isl.close.title" data-i18n-aria="isl.close.aria">
            <svg class="ic" data-icon="x" viewBox="0 0 24 24"></svg>
          </button>
        </div>
        <div id="undo-bar" hidden role="status" aria-live="polite"></div>
      </div>
      <div id="body"></div>
    </div>
  </div>
  <script src="sfx.js"></script>
  <script src="motion.js"></script>
  <script src="locales/en.js"></script>
<script src="locales/ar.js"></script>
<script src="lib/i18n.js"></script>
<script src="ui-shared.js"></script>
<script src="lib/share.js"></script>
  <script src="island.js"></script>
</body>
</html>
