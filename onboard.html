<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title data-i18n="ob.title">Welcome to Todo Island</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="window.css">
<link rel="stylesheet" href="onboard.css">
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>
  <header>
    <span class="logo"><span class="mark now" aria-hidden="true">[&#9733;]</span> <span data-i18n="app.name">Todo Island</span></span>
    <span class="step-count" id="step-count" dir="ltr" aria-hidden="true">1 / 4</span>
  </header>

  <!-- the stage: a miniature desktop that stays put while the steps change under it.
       Pure illustration (aria-hidden) — every choice it shows is also a real control below. -->
  <div class="stage" id="stage" data-scene="welcome" aria-hidden="true">
    <span class="sb sb-1"></span><span class="sb sb-2"></span><span class="sb sb-3"></span>
    <span class="st-edge"></span>

    <div class="st-pill glass up" id="st-pill">
      <span class="g-arc"></span>
      <span class="sp-mark" id="sp-mark">[&#9733;]</span>
      <span class="sp-title" id="sp-title"></span>
      <span class="sp-bang" id="sp-bang">!!</span>
      <span class="sp-due" id="sp-due"></span>
    </div>

    <!-- 1 · a line you type becomes the island -->
    <div class="scene sc-welcome">
      <div class="note-sheet glass" id="st-note">
        <span class="ns-file" id="st-file">work-tasks.md</span>
        <code class="ns-line" dir="ltr"><span class="ns-type" id="st-type"></span><span class="caret" id="st-caret"></span></code>
        <code class="ns-line dim" dir="ltr" id="st-line2"></code>
      </div>
    </div>

    <!-- 2 · the notes the island reads -->
    <div class="scene sc-notes">
      <div class="files">
        <div class="file glass" data-file="work">
          <svg class="f-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/><path d="M9 12h6M9 16h4"/></svg>
          <b class="f-name" data-fname></b>
          <span class="f-stat" data-fstat></span>
          <code class="f-line" dir="ltr" data-fline="1"></code>
          <code class="f-line dim" dir="ltr" data-fline="2"></code>
        </div>
        <div class="file glass" data-file="personal">
          <svg class="f-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/><path d="M9 12h6M9 16h4"/></svg>
          <b class="f-name" data-fname></b>
          <span class="f-stat" data-fstat></span>
          <code class="f-line" dir="ltr" data-fline="1"></code>
          <code class="f-line dim" dir="ltr" data-fline="2"></code>
        </div>
      </div>
    </div>

    <!-- 3 · your day, and when the island drops in -->
    <div class="scene sc-day">
      <div class="day glass">
        <div class="day-sum"><b id="day-count"></b><span class="day-next" id="day-next"></span></div>
        <div class="ribbon" dir="ltr" id="ribbon">
          <span class="rb-night" id="rb-night"><svg class="rb-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></span>
          <span class="rb-work" id="rb-work"></span>
          <span class="rb-ticks" id="rb-ticks"></span>
          <span class="rb-now" id="rb-now"></span>
        </div>
        <div class="rb-axis" dir="ltr"><span>00</span><span>06</span><span>12</span><span>18</span><span>24</span></div>
        <div class="rb-legend">
          <span><i class="lg lg-quiet"></i><span data-i18n="ob.day.quiet">quiet</span></span>
          <span id="lg-work-wrap"><i class="lg lg-work"></i><span id="lg-work">work hours</span></span>
          <span id="lg-off-wrap"><i class="lg lg-off"></i><span data-i18n="ob.day.after">after hours</span></span>
        </div>
      </div>
    </div>

    <!-- 4 · your shortcut calls the island -->
    <div class="scene sc-ready">
      <div class="caps" id="st-caps" dir="ltr"></div>
    </div>
  </div>

  <main id="flow">
    <!-- 1 · Welcome -->
    <section class="screen" data-step="1" aria-labelledby="h1">
      <h1 id="h1" class="lead" tabindex="-1" data-i18n="ob.w.h">Your notes, gently on top.</h1>
      <p class="sub" data-i18n="ob.w.sub"></p>
      <ul class="values">
        <li><span class="glyph">.md</span><span data-i18n="ob.w.v1"></span></li>
        <li><span class="glyph p2">!!</span><span data-i18n="ob.w.v2"></span></li>
        <li><span class="glyph acc">[&#9733;]</span><span data-i18n="ob.w.v3"></span></li>
      </ul>
      <p class="fine" data-i18n="ob.w.time"></p>
    </section>

    <!-- 2 · Your tasks -->
    <section class="screen" data-step="2" aria-labelledby="h2" hidden>
      <p class="ob-notice" id="repair" role="status" hidden></p>
      <h2 id="h2" class="md-h big" tabindex="-1"><span class="hash">##</span> <span data-i18n="ob.t.h">Your tasks</span></h2>
      <p class="sub" data-i18n="ob.t.sub"></p>
      <div class="modes" role="radiogroup" data-i18n-aria="ob.t.aria">
        <button class="mode" role="radio" data-mode="both" type="button"><b data-i18n="ob.mode.both"></b><span data-i18n="ob.mode.both.hint"></span></button>
        <button class="mode" role="radio" data-mode="work" type="button"><b data-i18n="ob.mode.work"></b><span data-i18n="ob.mode.work.hint"></span></button>
        <button class="mode" role="radio" data-mode="personal" type="button"><b data-i18n="ob.mode.personal"></b><span data-i18n="ob.mode.personal.hint"></span></button>
      </div>
      <div class="notes">
        <div class="note-pick" data-note="work">
          <div class="np-text">
            <div class="np-head"><b data-i18n="ob.note.work"></b><button class="btn-text np-reset" data-reset type="button" data-i18n="ob.pick.reset" hidden></button></div>
            <p class="np-stat" data-stat role="status"></p>
          </div>
          <div class="np-btns">
            <button class="btn-soft sm" data-pick="file" type="button" data-i18n="ob.pick.file"></button>
            <button class="btn-soft sm" data-pick="folder" type="button" data-i18n="ob.pick.folder"></button>
          </div>
        </div>
        <div class="note-pick" data-note="personal">
          <div class="np-text">
            <div class="np-head"><b data-i18n="ob.note.personal"></b><button class="btn-text np-reset" data-reset type="button" data-i18n="ob.pick.reset" hidden></button></div>
            <p class="np-stat" data-stat role="status"></p>
          </div>
          <div class="np-btns">
            <button class="btn-soft sm" data-pick="file" type="button" data-i18n="ob.pick.file"></button>
            <button class="btn-soft sm" data-pick="folder" type="button" data-i18n="ob.pick.folder"></button>
          </div>
        </div>
      </div>
      <p class="fine" data-i18n="ob.t.fine"></p>
    </section>

    <!-- 3 · Reminders -->
    <section class="screen" data-step="3" aria-labelledby="h3" hidden>
      <h2 id="h3" class="md-h big" tabindex="-1"><span class="hash">##</span> <span data-i18n="ob.r.h">Reminders</span></h2>
      <p class="sub" data-i18n="ob.r.sub"></p>
      <div class="opts">
        <div class="orow">
          <label for="ob-rem"><b data-i18n="ob.r.on"></b><span data-i18n="ob.r.on.hint"></span></label>
          <input id="ob-rem" type="checkbox" role="switch" class="switch" checked>
        </div>
        <div class="orow" data-needs-rem>
          <label for="ob-start"><b id="hours-label"></b><span id="hours-hint"></span></label>
          <div class="hours" dir="ltr"><input id="ob-start" type="text" inputmode="numeric" maxlength="5" lang="en" spellcheck="false" value="09:00" data-i18n-aria="ob.r.start"><span class="dash">&ndash;</span><input id="ob-end" type="text" inputmode="numeric" maxlength="5" lang="en" spellcheck="false" value="17:00" data-i18n-aria="ob.r.end"></div>
        </div>
        <div class="orow" data-needs-rem>
          <span class="olabel"><b data-i18n="ob.r.every"></b><span data-i18n="ob.r.every.hint"></span></span>
          <div class="freq" role="radiogroup" data-i18n-aria="ob.r.every.aria">
            <button class="chip mono" role="radio" data-every="15" type="button">15m</button>
            <button class="chip mono" role="radio" data-every="30" type="button">30m</button>
            <button class="chip mono" role="radio" data-every="60" type="button">1h</button>
            <button class="chip mono" role="radio" data-every="90" type="button">90m</button>
          </div>
        </div>
        <div class="orow">
          <label for="ob-auto"><b data-i18n="ob.r.auto"></b><span data-i18n="ob.r.auto.hint"></span></label>
          <input id="ob-auto" type="checkbox" role="switch" class="switch" checked>
        </div>
      </div>
      <p class="fine" data-i18n="ob.r.fine"></p>
    </section>

    <!-- 4 · Ready -->
    <section class="screen" data-step="4" aria-labelledby="h4" hidden>
      <h2 id="h4" class="lead" tabindex="-1" data-i18n="ob.ready.h">You&rsquo;re set.</h2>
      <p class="sub"><span data-i18n="ob.ready.sub"></span> <span class="keys" id="keys"></span></p>
      <ul class="made" id="made"></ul>
      <p class="err" id="finish-err" role="alert" hidden></p>
    </section>
  </main>

  <footer class="ob-foot">
    <div class="dots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div class="ob-actions">
      <button class="btn-text" id="btn-skip" type="button"></button>
      <button class="btn-text" id="btn-back" type="button" data-i18n="ob.btn.back" hidden></button>
      <button class="btn-soft" id="btn-open" type="button" data-i18n="ob.btn.open" hidden></button>
      <button class="btn-accent" id="btn-next" type="button"></button>
    </div>
  </footer>
  <script src="motion.js"></script>
  <script src="locales/en.js"></script>
  <script src="locales/ar.js"></script>
  <script src="lib/i18n.js"></script>
  <script src="ui-shared.js"></script>
  <script src="onboard.js"></script>
</body>
</html>
