<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quick edit</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="window.css">
<link rel="stylesheet" href="editor.css">
</head>
<body>
  <header>
    <span class="logo"><span class="mark" id="ed-mark" aria-hidden="true">[ ]</span> Quick edit</span>
    <span id="ed-badge" class="badge"></span>
  </header>
  <main id="ed-main">
    <p class="empty" id="ed-missing" hidden>Task not found — it may have been completed or removed.</p>
    <div id="ed-form" hidden>
      <div class="field"><label for="ed-title">Task <span class="label-hint">— first line is the title, lines below become its description</span></label>
        <textarea id="ed-title" rows="1" spellcheck="false"></textarea>
      </div>
      <div class="field-row">
        <div class="field"><label>Priority</label>
          <div class="chips" id="ed-prio" aria-label="Priority"></div>
        </div>
        <div class="field"><label>Now</label>
          <button class="chip" id="ed-active" type="button" aria-pressed="false">&#9733; Working on it</button>
        </div>
      </div>
      <div class="field"><label>Due</label>
        <div class="chips" id="ed-due" aria-label="Due date"></div>
      </div>
      <div class="field"><label for="ed-sub">Subtasks</label>
        <ul class="subs-list" id="ed-subs"></ul>
        <div class="addsub"><input type="text" id="ed-sub" placeholder="New subtask…"><button id="ed-addsub" type="button">Add</button></div>
      </div>
      <div class="save-bar">
        <div class="ed-preview"><span class="pv-label">will write</span><code id="ed-preview-line"></code></div>
        <div class="ed-actions">
          <button class="btn-accent" id="ed-save" type="button" title="Save (Ctrl+Enter)">Save</button>
          <button class="btn-soft" id="ed-complete" type="button">
            <svg class="ic" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>Complete
          </button>
          <span class="saved" id="ed-saved" hidden role="status">Saved ✓</span>
          <div class="menu-wrap">
            <button class="btn-soft btn-icon" id="ed-more" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="ed-menu" title="More" aria-label="More actions">
              <svg class="ic" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg>
            </button>
            <div class="menu" id="ed-menu" role="menu" hidden>
              <button role="menuitem" id="ed-up" type="button">Move up</button>
              <button role="menuitem" id="ed-down" type="button">Move down</button>
              <hr>
              <button role="menuitem" id="ed-delete" class="danger" type="button">Delete task</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
  <script src="sfx.js"></script>
  <script src="motion.js"></script>
  <script src="ui-shared.js"></script>
  <script src="editor.js"></script>
</body>
</html>
