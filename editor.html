<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quick edit</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="window.css">
<link rel="stylesheet" href="editor.css">
</head>
<body>
  <header>
    <span class="logo"><span class="mark" id="ed-mark" aria-hidden="true">[ ]</span> Quick edit</span>
    <span id="ed-badge" class="badge"></span>
  </header>
  <main id="ed-main">
    <p class="empty" id="ed-missing" hidden>Task not found — it may have been completed or removed.</p>
    <div id="ed-form" hidden>
      <div class="field"><label>Task <span class="label-hint">— first line is the title, lines below become its description</span></label>
        <textarea id="ed-title" rows="1" spellcheck="false"></textarea>
      </div>
      <div class="field"><label>Priority</label>
        <div class="chips" id="ed-prio"></div>
      </div>
      <div class="field"><label>Now</label>
        <div class="chips">
          <button class="chip" id="ed-active" type="button" aria-pressed="false">&#9733; Working on it now</button>
        </div>
      </div>
      <div class="field"><label>Due</label>
        <div class="chips" id="ed-due"></div>
      </div>
      <div class="field"><label>Subtasks</label>
        <ul class="subs-list" id="ed-subs"></ul>
        <div class="addsub"><input type="text" id="ed-sub" placeholder="New subtask…"><button id="ed-addsub" type="button">Add</button></div>
      </div>
      <div class="save-bar">
        <button class="btn-accent" id="ed-save" type="button">Save changes</button>
        <button class="btn-complete" id="ed-complete" type="button">
          <svg class="ic" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>Complete
        </button>
        <button class="btn-soft btn-icon" id="ed-up" type="button" title="Move up" aria-label="Move task up"><svg class="ic" viewBox="0 0 24 24"><path d="M18 15l-6-6-6 6"/></svg></button>
        <button class="btn-soft btn-icon" id="ed-down" type="button" title="Move down" aria-label="Move task down"><svg class="ic" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
        <button class="btn-danger" id="ed-delete" type="button">Delete</button>
        <span class="saved" id="ed-saved" hidden>Saved ✓</span>
      </div>
    </div>
  </main>
  <script src="sfx.js"></script>
  <script src="motion.js"></script>
  <script src="ui-shared.js"></script>
  <script src="editor.js"></script>
</body>
</html>
